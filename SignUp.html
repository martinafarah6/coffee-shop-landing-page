<!DOCTYPE html>
<htm>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <header class="singup">
            <h2 >SIGN UP</h2>
        </header>
        <form method="get" class="form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="8+ chars, A-Z, 0-9, #$" required>
            </div>  
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Enter your password again">
            </div>
            <button type="submit">Submit</button>
        </form>
        <footer>
            <h2>Caffainaaaa</h2>
            <p>Brewed with passion, served with love.</p>
            <p class="copyright">© 2026 Caffainaaaa. All rights reserved.</p>
        </footer>
    </body>
</htm>
